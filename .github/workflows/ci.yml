name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # DC-V18 reads the release tag by name. fetch-tags alone leaves the
          # tag unresolvable on a shallow pull-request checkout, so take the
          # full history, which carries the tags with it.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install --yes librsvg2-bin
      - run: npm ci
      - run: npm run check
      # The UI redesign contract. --ratchet compares the pass count with
      # scripts/redesign-baseline/passing.txt and fails on any difference, so
      # the conditions still open do not block unrelated work, and a change
      # that turns one green has to record the new count.
      - run: bash scripts/verify-design-contract.sh --ratchet
      - run: npm run pack:check
      - run: npm ci --prefix site
      - run: npm audit --prefix site --omit=dev --audit-level=high
      - run: npm run lint --prefix site
      - run: npm test --prefix site
