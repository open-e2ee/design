name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # DC-V18 reads the release tag by name. fetch-tags alone leaves the
          # tag unresolvable on a shallow pull-request checkout, so take the
          # full history, which carries the tags with it.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Show Node.js version
        run: node --version
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install --yes librsvg2-bin
      - run: npm ci
      - run: npm run check
      # The design contract verifier. Every condition must pass. The script
      # exits non-zero while any condition fails, and it prints a FAIL line
      # that names each failed condition.
      - run: bash scripts/verify-design-contract.sh
      - run: npm run pack:check
      - run: npm ci --prefix site
      - run: npm audit --prefix site --omit=dev --audit-level=high
      - run: npm run lint --prefix site
      - run: npm test --prefix site
